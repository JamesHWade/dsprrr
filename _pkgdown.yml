url: https://jameshwade.github.io/dsprrr/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#C9544D"
    border-radius: "0.5rem"
    btn-border-radius: "0.375rem"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Fira Code"}

home:
  title: "dsprrr: typed, testable LLM programs in R"
  description: >
    Declare LLM tasks in R with typed inputs and outputs, measure them with
    metrics, and improve their instructions and examples with your data.

