logo:
  file: man/figures/logo.png
  alt: dsprrr hex sticker

redirects:
  - ["articles/getting-started.html", "articles/tutorial-hello-world.html"]
  - ["articles/vitals-integration.html", "articles/vitals-recipes.html"]
  - ["articles/concepts-dspy-philosophy.html", "articles/concepts-signatures-modules.html"]
  - ["articles/advanced-ellmer.html", "articles/models-and-providers.html"]
  - ["articles/reasoning-models.html", "articles/models-and-providers.html"]

articles:
  - title: Tutorials
    desc: >
      Start here. Six short steps from a first call to a saved, optimized
      module; each one builds on the last.
    contents:
    - tutorial-hello-world
    - tutorial-build-classifier
    - tutorial-structured-outputs
    - tutorial-improve-with-demos
    - tutorial-optimize-your-module
    - tutorial-deploy-to-production

  - title: Projects
    desc: Longer worked examples on a realistic task.
    contents:
    - llms-txt
    - articles/tutorial-rlm-dsprrr
    - text-adventure

  - title: Build
    desc: Pick a module type, compose modules, and add retrieval or decisions.
    contents:
    - advanced-modules
    - chaining-modules
    - rag-workflows
    - calibrated-decisions

  - title: Measure and improve
    desc: Evaluate modules and optimize them with data.
    contents:
    - compilation-optimization
    - advanced-optimization
    - vitals-recipes

  - title: Run
    desc: Configure models and run dsprrr in larger workflows.
    contents:
    - models-and-providers
    - orchestration
    - tidymodels-integration
    - troubleshooting

  - title: Concepts
    desc: How dsprrr works and why, and how it maps to DSPy.
    contents:
    - concepts-signatures-modules
    - concepts-why-metrics-matter
    - concepts-optimization-theory
    - dspy-comparison
    - articles/how-rlm-works

  - title: Experimental
    desc: Features whose interfaces may change.
    contents:
    - articles/flex-optimization
    - articles/omni-meta-optimization
    - articles/agentic-optimization-harnesses

  - title: Reference
    desc: Quick lookup.
    contents:
    - cheatsheet

reference:
  - title: Signatures
    desc: Declare a task's inputs, typed outputs and instructions.
    contents:
    - signature
    - input
    - with_instructions
    - with_reasoning
    - without_reasoning
    - has_reasoning

  - title: Build a program
    desc: >
      Turn a signature into a module. `module()` makes one model call; the
      other constructors answer the same signature in a different way.
    contents:
    - module
    - chain_of_thought
    - multi_chain_comparison
    - react
    - rag_module
    - module_fn
    - flex

  - title: Compose programs
    desc: Chain modules, retry them with a reward, or combine several answers.
    contents:
    - pipeline
    - step
    - best_of_n
    - refine
    - as_reward_fn
    - ensemble
    - reduce_majority
    - reduce_weighted_vote
    - reduce_first
    - reduce_best_by_metric

  - title: Programs that run code
    desc: Let a model write and run R code, and choose where that code runs.
    contents:
    - program_of_thought
    - code_act
    - rlm_module
    - rlm
    - r_code_runner
    - mcp_repl_runner
    - run_demo

  - title: Run programs
    desc: >
      Run a module on named inputs or on a data frame, in parallel,
      asynchronously or as a stream, and read what came back.
    contents:
    - run
    - run_dataset
    - predict.Module
    - concurrency_control
    - run_async
    - run_stream
    - stream_listener
    - stream_async
    - accessors

  - title: Validate outputs
    desc: Check outputs and retry with feedback when a check fails.
    contents:
    - with_assertions
    - assertions
    - assert_length
    - assert_contains
    - assert_not_contains
    - assert_matches
    - assert_not_matches
    - assert_one_of
    - assert_range
    - assert_not_empty
    - assert_custom

  - title: Evaluate
    desc: Score a program on labeled data with a metric.
    contents:
    - evaluate
    - metric_exact_match
    - metric_f1
    - metric_contains
    - metric_field_match
    - metric_custom
    - metric_threshold
    - metric_with_feedback
    - metric_with_trace
    - vitals_metrics

  - title: Optimize with compile()
    desc: >
      Optimizers, which dsprrr calls teleprompters, tune a program's
      demonstrations, instructions or decision rules against a metric. The
      "Choose an optimizer" article compares them.
    contents:
    - compile
    - LabeledFewShot
    - BootstrapFewShot
    - BootstrapFewShotWithRandomSearch
    - KNNFewShot
    - COPRO
    - MIPROv2
    - GEPA
    - SIMBA
    - GridSearchTeleprompter
    - BetterTogether
    - ReAnchor
    - Teleprompter

  - title: Experimental optimizers
    desc: Compose optimizers, or let an agent run optimization experiments.
    contents:
    - Omni
    - AutoResearch
    - MetaHarness

  - title: Inspect optimization results
    desc: See what an optimizer changed and reuse the result.
    contents:
    - optimization_result
    - optimization_summary
    - best_params
    - best_demos
    - top_trials
    - config_diff
    - apply_best_config
    - export_module_code

  - title: Grid search
    desc: Try combinations of request settings, instructions and templates.
    contents:
    - optimize_grid
    - module_trials
    - module_metrics
    - module_parameters

  - title: Calibrated decisions
    desc: >
      Experimental. Yes/no and label outputs decoded locally from probability
      evidence, with thresholds you can tune.
    contents:
    - decision_types
    - with_decisions
    - decision_settings
    - decision_evidence

  - title: Models and caching
    desc: Choose the chat a call uses and control the response cache.
    contents:
    - dsp_configure
    - get_default_chat
    - with_lm
    - is_reasoning_model
    - configure_cache
    - cache_stats
    - clear_cache
    - dsprrr_sitrep

  - title: Prompts, traces and costs
    desc: Inspect what was sent to the model, what came back and what it cost.
    contents:
    - get_last_prompt
    - inspect_history
    - clear_prompt_history
    - export_traces
    - summarize_traces
    - clear_traces
    - session_cost

  - title: Save and deploy
    desc: Save programs, pin them to a board, and start a workflow project.
    contents:
    - program-artifact
    - pin_module_config
    - restore_module_config
    - pin_trace
    - pin_vitals_log
    - use_dsprrr_template
    - validate_workflow

  - title: Program graphs
    desc: Inspect, freeze and transform the modules inside a program.
    contents:
    - module-graph

  - title: vitals
    desc: Evaluate modules with the vitals package.
    contents:
    - as_vitals_solver
    - as_vitals_task
    - as_vitals_samples
    - as_vitals_cost
    - as_dsprrr_traces
    - summarize_traces_df
    - as_dsprrr_metric

  - title: Tools and retrieval
    desc: Expose modules as ellmer tools and search document stores.
    contents:
    - as_ellmer_tool
    - ragnar_tool
    - create_search_tool

  - title: tidymodels
    desc: A parsnip model specification and dials parameters.
    contents:
    - llm_predict
    - register_dsprrr_engine
    - temperature
    - top_p
    - reasoning_effort

  - title: Build your own optimizer
    desc: Lower-level pieces the built-in optimizers are made from.
    contents:
    - optimizer_control
    - eval_program
    - sample_dataset
    - split_dataset
    - TrialLog
    - create_trial
    - complete_trial
    - write_trials_jsonl
    - read_trials_jsonl
    - load_trial_log
