url: https://jameshwade.github.io/dsprrr/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#6366f1"
    border-radius: "0.5rem"
    btn-border-radius: "0.375rem"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Fira Code"}

home:
  title: "dsprrr: Programming—not prompting—LLMs in R"
  description: >
    dsprrr brings the power of DSPy to R. Instead of wrestling with prompt strings,
    declare what you want, compose modules into pipelines, and let optimization find
    the best prompts automatically.

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Learn
      menu:
        - text: "Getting Started"
          href: articles/getting-started.html
        - text: "Quick Reference"
          href: articles/cheatsheet.html
        - text: "Troubleshooting"
          href: articles/troubleshooting.html
        - text: "Compilation & Optimization"
          href: articles/compilation-optimization.html
        - text: "---"
        - text: "Integrations"
        - text: "Vitals Integration"
          href: articles/vitals-integration.html
        - text: "Production Orchestration"
          href: articles/orchestration.html

logo:
  file: man/figures/logo.png
  alt: dsprrr hex sticker

articles:
  - title: Getting Started
    navbar: ~
    contents:
    - getting-started
    - cheatsheet
    - troubleshooting

  - title: Core Workflows
    desc: Learn how to build and optimize LLM applications
    contents:
    - compilation-optimization
    - vitals-integration

  - title: Production
    desc: Deploy and orchestrate LLM workflows
    contents:
    - orchestration

reference:
  - title: Core Functions
    desc: Main functions for building LLM applications
    contents:
    - signature
    - module
    - run
    - run_dataset
    - predict.Module
    - evaluate
    - evaluate_dsp

  - title: Chat-Centric API
    desc: ellmer-style pipe-friendly functions
    contents:
    - dsp
    - as_module
    - get_last_trace

  - title: Configuration
    desc: Setup and configure dsprrr
    contents:
    - dsp_configure
    - dsprrr_sitrep
    - default-chat
    - get_default_chat
    - set_default_chat
    - clear_default_chat

  - title: Async and Streaming
    desc: Asynchronous and streaming operations
    contents:
    - async
    - run_async
    - stream_async

  - title: Signatures and Inputs
    desc: Define module interfaces
    contents:
    - input
    - starts_with("input_")
    - dsp_trainset

  - title: Teleprompters
    desc: Optimization strategies
    contents:
    - Teleprompter
    - LabeledFewShot
    - GridSearchTeleprompter

  - title: Optimization
    desc: Functions for optimizing module performance
    contents:
