articles:
  - title: Tutorials
    desc: >
      Start here. Six short steps from a first call to a saved, optimized
      module; each one builds on the last.
    contents:
    - tutorial-hello-world
    - tutorial-build-classifier
    - tutorial-structured-outputs
    - tutorial-improve-with-demos
    - tutorial-optimize-your-module
    - tutorial-deploy-to-production

  - title: Projects
    desc: Longer worked examples on a realistic task.
    contents:
    - llms-txt
    - articles/tutorial-rlm-dsprrr
    - text-adventure

  - title: Build
    desc: Pick a module type, compose modules, and add retrieval or decisions.
    contents:
    - advanced-modules
    - chaining-modules
    - rag-workflows
    - calibrated-decisions

  - title: Measure and improve
    desc: Evaluate modules and optimize them with data.
    contents:
    - compilation-optimization
    - advanced-optimization
    - vitals-recipes

  - title: Run
    desc: Configure models and run dsprrr in larger workflows.
    contents:
    - models-and-providers
    - orchestration
    - tidymodels-integration
    - troubleshooting

  - title: Concepts
    desc: How dsprrr works and why, and how it maps to DSPy.
    contents:
    - concepts-signatures-modules
    - concepts-why-metrics-matter
    - concepts-optimization-theory
    - dspy-comparison
    - articles/how-rlm-works

  - title: Experimental
    desc: Features whose interfaces may change.
    contents:
    - articles/flex-optimization
    - articles/omni-meta-optimization
    - articles/agentic-optimization-harnesses

  - title: Reference
    desc: Quick lookup.
    contents:
    - cheatsheet

# ── Reference ──────────────────────────────────────────────────────────────────
# Organized as: Define → Build → Compose → Validate → Evaluate →
#               Optimize → Configure → Deploy → Integrate

