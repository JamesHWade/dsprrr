          href: articles/tutorial-structured-outputs.html
        - text: "4. Improve with examples"
          href: articles/tutorial-improve-with-demos.html
        - text: "5. Optimize a module"
          href: articles/tutorial-optimize-your-module.html
        - text: "6. Save and reuse a module"
          href: articles/tutorial-deploy-to-production.html
        - text: "---"
        - text: "Projects"
        - text: "Generate an llms.txt file"
          href: articles/llms-txt.html
        - text: "Investigate a regression with RLM"
          href: articles/tutorial-rlm-dsprrr.html
        - text: "Build a text adventure"
          href: articles/text-adventure.html
    howto:
      text: How-to guides
      menu:
        - text: "Build"
        - text: "Choose a module type"
          href: articles/advanced-modules.html
        - text: "Chain modules into pipelines"
          href: articles/chaining-modules.html
        - text: "Retrieval-augmented generation"
          href: articles/rag-workflows.html
        - text: "Calibrated decisions"
          href: articles/calibrated-decisions.html
        - text: "---"
        - text: "Measure and improve"
        - text: "Compile and optimize"
          href: articles/compilation-optimization.html
        - text: "Choose an optimizer"
          href: articles/advanced-optimization.html
        - text: "Evaluate with vitals"
          href: articles/vitals-recipes.html
        - text: "---"
        - text: "Run"
        - text: "Models, providers and streaming"
