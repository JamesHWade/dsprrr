                  "text": "{\"wrapper\":\"# dsprrr\\n\\nFacilitates creation, optimization, and systematic improvement of LLM-powered workflows in R using data-driven, testable, and composable programmatic constructs.\\n\\n## Key Concepts\\n\\n- **Declarative Signatures**: Formal notation for precise LLM input/output schema, ensuring type safety.\\n- **Composable Modules**: Encapsulated, reusable LLM workflow components for building complex applications.\\n- **Prompt Optimization**: Data-driven, automatic prompt/workflow refinement to boost performance and robustness.\\n- **Test-Driven Refinement**: Iterative workflow improvement using tests, labeled data, and automated analysis.\\n- **tidyverse Integration**: Seamless workflow with tidyverse packages and tidy data structures.\\n\\n## Quick Start\\n\\n```r\\nlibrary(dsprrr)\\n\\n# Define an LLM workflow signature\\nsig <- signature(\\\"question -> answer\\\")\\n\\n# Quick check of the signature object\\nprint(sig)\\n```\\n\\n## Common Workflow\\n\\n```r\\nlibrary(dsprrr)\\n\\n# Define signature for QA workflow\\nqa_sig <- signature(\\\"question -> answer\\\")\\n\\n# Create a QA module\\nqa_mod <- module(\\n  signature = qa_sig,\\n  template = \\\"Q: {question}\\\\nA:\\\"\\n)\\n\\n# Prepare test data\\ntest_data <- tibble::tibble(question = \\\"What is the capital of France?\\\")\\n\\n# Run the module\\nresult <- run(qa_mod, test_data)\\nprint(result)\\n\\n# (Optional) Evaluate accuracy if ground-truth labels available\\ngold <- tibble::tibble(answer = \\\"Paris\\\")\\nmetrics <- evaluate(qa_mod, test_data, gold)\\nprint(metrics)\\n```\\n\\n## Code Organization\\n\\n- **module.R**: Main LLM module abstraction and orchestration.\\n- **signature.R**: Declarative signature parsing/validation.\\n- **optimizer-core.R**: Optimization logic for improvements.\\n- **run.R**: Workflow and simulation execution.\\n- **evaluate.R**: Assessment/metrics for workflow performance.\\n- Modular design separates modules, signatures, optimizers, and helpers.\\n\\n## Entry Points\\n\\n- `signature` \u2014 construct workflow signatures\\n- `module` \u2014 define an LLM workflow/module\\n- `run`, `run_async` \u2014 execute LLM modules\\n- `evaluate`, `eval_program` \u2014 measure performance/quality\\n- `optimize_grid`, `optimizer_control` \u2014 trigger and control optimization processes\\n\\n## Watch Out For\\n\\n- Always specify all required fields and their types in signatures for advanced modules.\\n- For large datasets with `run()`, batch/paginate requests to avoid LLM rate limits.\\n- When evaluating, provide both ground truth and matching columns to your test data, or evaluation will fail with errors.\"}"
