                  "text": "{\"reasoning\":\"Since dsprrr revolves around (1) declaring input-output structure via signatures, (2) defining modules encapsulating LLM logic, (3) running and evaluating these workflows, and (4) optimizing prompts based on metrics, examples should start with basic signature/module creation, then move to execution with sample data, and finally show (in outline) optimization or evaluation. I should ensure the syntax is accurate, functions are properly called, and concepts are demonstrated clearly.\",\"basic\":\"library(dsprrr)\\n\\n# Define an LLM workflow signature\\nsig <- signature(\\\"question -> answer\\\")\\n\\n# Quick check of the signature object\\nprint(sig)\",\"intermediate\":\"library(dsprrr)\\n\\n# Define a signature for a simple QA workflow\\nqa_sig <- signature(\\\"question -> answer\\\")\\n\\n# Create a module (LLM workflow)\\nqa_mod <- module(\\n  signature = qa_sig,\\n  template = \\\"Q: {question}\\\\nA:\\\"\\n)\\n\\n# Run the module on a new question\\ntest_data <- tibble::tibble(question = \\\"What is the capital of France?\\\")\\nresult <- run(qa_mod, test_data)\\nprint(result)\\n\\n# Evaluate result (if ground truth is available)\\ngold <- tibble::tibble(answer = \\\"Paris\\\")\\nmetrics <- evaluate(qa_mod, test_data, gold)\\nprint(metrics)\",\"gotchas\":[\"For more advanced modules, forgetting to specify required signature fields (like field types) can lead to cryptic errors.\",\"If using run() with a large dataset, forgetting to batch or paginate requests can result in rate-limit errors from the LLM provider.\",\"When evaluating, you must provide both ground-truth outputs and the same columns as the test data, or evaluation will fail.\"]}"
