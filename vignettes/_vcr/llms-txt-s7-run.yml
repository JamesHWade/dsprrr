                  "text": "{\"wrapper\":\"# dsprrr\\n\\nDeclarative, optimizable, and test-driven language model workflows for R.\\n\\n---\\n\\n## Key Concepts\\n\\n- **Declarative Signatures:** Compact notation for defining LLM inputs/outputs for strong workflow specification.\\n- **Prompt Optimization:** Automated, data-driven prompt improvement, reducing manual tuning overhead.\\n- **Composable Modules:** Workflows are built from testable, reusable modules.\\n- **Systematic Improvement:** Iterative, data-rich methods for upgrading workflow performance.\\n- **tidyverse Integration:** Seamless compatibility with the tidyverse for data manipulation and workflow management.\\n\\n---\\n\\n## Quick Start\\n\\n```r\\nlibrary(dsprrr)\\n\\n# Define an LLM workflow signature: input 'question' produces output 'answer'\\nsig <- signature('question -> answer')\\n\\n# Check the parsed signature object\\nprint(sig)\\n```\\n\\n---\\n\\n## Common Workflow\\n\\n```r\\nlibrary(dsprrr)\\nlibrary(tibble)\\n\\n# Define a workflow signature for a Q&A task\\nqa_sig <- signature('question -> answer')\\n\\n# Build a module using the signature\\naq_module <- module(signature = qa_sig, prompt = 'Answer concisely.')\\n\\n# Example questions\\ndata <- tibble(question = c('What is the capital of France?', 'Who wrote 1984?'))\\n\\n# Run the module on the dataset\\nanswers <- run(aq_module, data)\\n\\n# Print results\\nprint(answers)\\n\\n# Evaluate performance if you have answers\\ngt <- tibble(answer = c('Paris', 'George Orwell'))\\nres <- evaluate(answers, gt, metric = metric_exact_match)\\nprint(res)\\n```\\n\\n---\\n\\n## Code Organization\\n\\n- Codebase grouped by feature: assertions, modules, teleprompters, optimizers, signatures, orchestration.\\n- Each module/optimizer type is in a dedicated file (e.g., `module-ensemble.R`, `optimizer-discrete-bo.R`).\\n- Core abstractions in basal files; high-level workflow logic in `run.R` and `evaluate.R`.\\n\\n### Key Files\\n- `module.R`: Composable LLM workflow modules\\n- `signature.R`: Signature parsing and validation\\n- `run.R`: Orchestration and execution\\n- `optimize.R`: Data-driven prompt/program optimization\\n- `traces.R`: Tracing and diagnostics\\n\\n---\\n\\n## Entry Points\\n\\n- `signature`: Define workflow signatures\\n- `module`: Construct LLM workflow modules\\n- `run`: Execute workflows on data\\n- `evaluate`: Assess results against ground truth\\n- `optimize_grid`: Optimize hyperparameters or prompts\\n- `ensemble`: Combine modules for robustness or diversity\\n\\n---\\n\\n## Watch Out For\\n\\n- **Signature string syntax:** Must be of the form 'input -> output'; typos cause hard-to-trace errors.\\n- **LLM/API configuration:** Modules require functional LLM settings and/or API keys.\\n- **Input data shape:** Data frames for `run()` must precisely match signature fields by name and type.\\n\"}"
