                  "text": "{\"wrapper\":\"# dsprrr\\n\\nEnables principled, test-driven, and automatically optimizable LLM workflows in R. Moves LLM integration beyond prompt crafting to fully structured, data-driven programmatic development.\\n\\n---\\n\\n## Key Concepts\\n\\n- **Declarative Signatures**: Concisely specify LLM program inputs/outputs for validation and testing.\\n- **Composable Modules**: Reusable LLM workflow building blocks with explicit structure and parameters.\\n- **Automatic Prompt Optimization**: Tune/optimize LLM workflows using your own data\u2014no manual prompt tweaking.\\n- **Tracing and Debugging**: Monitor, log, and trace all LLM workflow steps and outputs to support rapid error diagnosis and iterative improvement.\\n- **tidyverse Integration**: Designed for seamless workflow and data interoperability with the tidyverse ecosystem.\\n\\n---\\n\\n## Quick Start\\n\\n### Basic Example\\n```r\\nlibrary(dsprrr)\\n\\n# Define a simple signature (input-output spec)\\nsig <- signature(\\\"question -> answer\\\")\\n\\n# Create a minimal module that uses this signature\\nmod <- module(sig)\\n\\n# Inspect the module\\nauto_print(mod)\\n```\\n\\n### Intermediate Example\\n```r\\nlibrary(dsprrr)\\nlibrary(tibble)\\n\\n# Define signature and module with a custom prompt\\ndemo_sig <- signature(\\\"text -> sentiment\\\")\\nsentiment_mod <- module(demo_sig, prompt = \\\"Classify the sentiment of the given text as Positive or Negative.\\\")\\n\\n# Compile the module before running (recommended for optimizations)\\ncompiled_mod <- compile(sentiment_mod)\\n\\n# Prepare a toy dataset\\ndf <- tibble::tibble(text = c(\\\"I love this!\\\", \\\"This is bad.\\\"))\\n\\n# Run the module over the data and collect traces\\nresults <- run(compiled_mod, df)\\n\\n# Inspect results and trace for troubleshooting\\nprint(results)\\ntraces <- summarize_traces(compiled_mod)\\nprint(traces)\\n```\\n\\n---\\n\\n## Common Workflow\\n\\n1. **Define signature:** Use `signature()` to specify inputs and outputs (e.g., `\\\"input -> output\\\"`).\\n2. **Build module:** Use `module()` with your signature, optionally providing a custom prompt.\\n3. **(Optional) Compile module:** Call `compile()` to optimize or prepare the module for data-driven enhancement.\\n4. **Run workflow:** Use `run()` on your module and data.\\n5. **Evaluate and debug:** Use `evaluate()`, `summarize_traces()`, and tidyverse tools for inspection and troubleshooting.\\n\\n---\\n\\n## Code Organization\\n\\n- **signature.R:** Declarative signature definitions for LLM modules.\\n- **module-base.R:** Core class for modules; other `module-*.R` files extend module logic/strategy.\\n- **run.R:** Main workflow execution logic.\\n- **compile.R:** Module compiling and preparation.\\n- **optimizer-core.R:** Core logic for data-driven workflow optimization.\\n- Also modular teleprompter (prompt strategy), orchestration, and validation files.\\n\\n---\\n\\n## Entry Points\\n\\n- `signature()`   \u2014 declare module I/O\\n- `module()`      \u2014 construct LLM module\\n- `compile()`     \u2014 optimize a module\\n- `run()`         \u2014 execute workflow on new data\\n- `evaluate()`    \u2014 assess module outputs\\n\\n---\\n\\n## Watch Out For\\n\\n- **Signature syntax:** Use the precise `'input -> output'` format. Errors here will prevent module creation.\\n- **Module compilation:** For optimization and full tracing, always compile modules before running. Skipping this may yield suboptimal results.\\n- **Module object model:** Modules are S7 (not simple functions). They encapsulate workflow state. Take care when reusing, composing, or mutating them.\\n\"}"
