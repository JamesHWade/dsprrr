                  "text": "{\"wrapper\":\"# dsprrr\\n\\nDeclarative Self-Improving Language Programs for R\\n\\n## Key Concepts\\n\\n- **Declarative Signatures:** Formal, compact specification of LLM input/output for systematic definition and validation.\\n- **Composable Modules:** Reusable workflow components for modular LLM program construction, testing, and tracing.\\n- **Automatic Prompt Optimization:** Data-driven routine to improve prompts; reduces manual editing.\\n- **Tracing and Evaluation:** Built-in tracking of execution and errors in multi-step workflows.\\n- **tidyverse Integration:** Seamless incorporation into modern R data pipelines.\\n\\n## Quick Start\\n\\n```r\\nlibrary(dsprrr)\\n# 1. Create a declarative signature\\nmy_sig <- signature(\\\"question -> answer\\\")\\n\\n# 2. Create a simple module using the signature\\nmy_mod <- module(signature = my_sig, prompt = \\\"What is the capital of France?\\\")\\n\\n# 3. Compile and run the module\\nprg <- compile(my_mod)\\nresult <- run(prg)\\nprint(result)\\n```\\n\\n## Common Workflow\\n\\n```r\\nlibrary(dsprrr)\\nlibrary(tibble)\\n\\n# Define signatures and build two modules\\nsig_qa <- signature(\\\"question -> answer\\\")\\nsig_explain <- signature(\\\"answer -> explanation\\\")\\n\\nmod_qa <- module(signature = sig_qa, prompt = \\\"What is the tallest mountain in the world?\\\")\\nmod_explain <- module(signature = sig_explain, prompt = \\\"Explain your answer.\\\")\\n\\n# Combine into a multi-step program\\nmulti_mod <- module(modules = list(mod_qa, mod_explain))\\nworkflow <- compile(multi_mod)\\n\\n# Example dataset for test-driven optimization\\ntestset <- tibble(question = c(\\\"What is the tallest mountain?\\\"), answer = c(\\\"Mount Everest\\\"))\\n\\n# Evaluate and get traces\\neval_result <- evaluate(workflow, dataset = testset, trace = TRUE)\\nprint(eval_result$metrics)\\nprint(eval_result$traces)\\n```\\n\\n## Code Organization\\n\\n- **signature.R:** Defines the 'Signature' abstraction and API for LLM input/output specification.\\n- **module.R:** Implements the 'module' abstraction for building unit and composite workflows.\\n- **compile.R:** Compiles modules and signatures into executable LLM workflows.\\n- **run.R:** Central logic to execute compiled programs.\\n- **optimizer-core.R:** Handles automatic workflow optimization, supporting data-driven improvements.\\n\\nCodebase is modular: each concept is clustered into specialized files, supporting extensibility and ease of maintenance.\\n\\n## Entry Points\\n\\n- `signature()` \u2013 Define input/output schemas for LLM workflows.\\n- `module()` \u2013 Compose single or multi-step LLM program logic.\\n- `compile()` \u2013 Compile modules and signatures into executable workflows.\\n- `run()` \u2013 Execute compiled workflows.\\n- `evaluate()` \u2013 Test, trace, and score workflows with data.\\n\\n## Watch Out For\\n\\n- All modules and signatures must match types/names precisely; changes break downstream modules.\\n- Prompt text and parameters are not auto-optimized\u2014explicit optimization is needed for best results.\\n- For best compatibility with ellmer/tidyverse, outputs may need conversion or use of helper functions.\\n\"}"
