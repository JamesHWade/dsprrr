        Language Programs for R\ndescription_text: Build principled, test-driven,
        and optimizable applications\nusing Large Language Models (LLMs) in R. Based
        on the DSPy framework\nfrom Stanford NLP, ''dsprrr'' moves beyond simple prompt
        engineering to\na structured programming model where LLM workflows are treated
        as\nprograms that can be systematically improved. Features include\ndeclarative
        signatures, composable modules, automatic prompt\noptimization, and deep integration
        with the tidyverse ecosystem.\nreadme_excerpt: \n<!-- README.md is generated
        from README.Rmd. Please edit that file -->\n\n# dsprrr <img src=\"man/figures/logo.png\"
        align=\"right\" width=\"160\" alt=\"dsprrr hex sticker\" />\n\n<!-- badges:
        start -->\n\n[![Lifecycle:\nexperimental](https://img.shields.io/badge/lifecycle-experimental-orange.svg)](https://lifecycle.r-lib.org/articles/stages.html#experimental)\n[![CRAN\nstatus](https://www.r-pkg.org/badges/version/dsprrr)](https://CRAN.R-project.org/package=dsprrr)\n[![R-CMD-check](https://github.com/JamesHWade/dsprrr/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/JamesHWade/dsprrr/actions/workflows/R-CMD-check.yaml)\n[![Codecov
        test\ncoverage](https://codecov.io/gh/JamesHWade/dsprrr/graph/badge.svg)](https://app.codecov.io/gh/JamesHWade/dsprrr)\n<!--
        badges: end -->\n\ndsprrr adds signatures, optimization, and tracing on top
        of\n[ellmer](https://ellmer.tidyverse.org). It implements ideas from\n[DSPy](https://dspy.ai)
        for R.\n\n**The problem:** Hand-tuned prompts are fragile. They break when
        you\nswitch models, change requirements, or scale up. dsprrr treats prompts\nas
        programs that can be systematically improved using your data.\n\n**Use cases:**\n\n-
        RAG pipelines where you want to optimize retrieval + generation\n  together\n-
        Classification or extraction tasks with labeled examples to learn from\n-
        Multi-step agents where you need to trace what went wrong\n- Any LLM workflow
        you want to improve without manually rewriting\n  prompts\n\n**When to just
        use ellmer:** If you have a prompt that works and don’t\nneed to optimize
        it with data. ellmer already tracks conversation\nhistory and token costs.\n\n##
        Installation\n\n``` r\n# install.packages(\"pak\")\npak::pak(\"JamesHWade/dsprrr\")\n```\n\n##
        What dsprrr adds\n\n### Signatures\n\nA compact notation for defining LLM
        inputs and outputs:\n\n``` r\nlibrary(dsprrr)\n#> \n#> Attaching package:
        ''dsprrr''\n#> The following object is masked from ''package:methods'':\n#>
        \n#>     signature\n\n# Arrow notation: inputs -> output\nsignature(\"question
