                  "text": "{\"wrapper\":\"# dsprrr\\n\\nTransform fragile prompt engineering into testable, modular, and self-improving LLM workflows in R. For R users building robust, scalable, and optimizable pipelines requiring systematic evaluation, improvement, or tidyverse-style integration.\\n\\n---\\n\\n## Key Concepts\\n\\n- **Declarative Signatures**: Compact notation specifying LLM module inputs/outputs for structured workflows.\\n- **Composable Modules**: Reusable components for building and combining LLM workflow steps.\\n- **Automatic Prompt Optimization**: Systematically improves prompts/programs using labeled data.\\n- **Test-driven LLM Programming**: Treat workflows as programs\u2014you get tracing, validation, logging, and debugging.\\n- **Tidyverse Integration**: Native compatibility with tibble/data.frame and data pipelines.\\n\\n---\\n\\n## Quick Start\\n\\n**Minimal Example**\\n```r\\nlibrary(dsprrr)\\n# Define workflow interface\\nsig <- signature(\\\"question -> answer\\\")\\n# Create a module\\nmod <- module(sig, prompt = \\\"Answer the following: {question}\\\")\\n```\\n\\n**Evaluate a module on real data**\\n```r\\nlibrary(dsprrr)\\nlibrary(tibble)\\n\\nsig <- signature(\\\"question -> answer\\\")\\nmod <- module(sig, prompt = \\\"What is the capital of {question}?\\\")\\n\\ntestset <- tibble(\\n  question = c(\\\"France\\\", \\\"Germany\\\"),\\n  answer = c(\\\"Paris\\\", \\\"Berlin\\\")\\n)\\n\\ntest_outputs <- run(mod, data = testset)\\neval_result <- evaluate(mod, data = testset)\\nprint(eval_result)\\n```\\n\\n---\\n\\n## Common Workflow\\n1. **Define signature**: Specify the workflow API (inputs/outputs).\\n2. **Build module**: Create a module with your signature and a prompt/program.\\n3. **Run**: Apply module to new data or test cases.\\n4. **Evaluate**: Compare LLM results to ground truth for test-driven improvement.\\n5. **Optimize** *(optional)*: Use optimize_grid and others to tune prompts/configs based on evaluation sets.\\n\\n---\\n\\n## Code Organization\\n- **By abstraction**: signatures (`signature.R`), modules (`module.R`), optimization (`optimizer-core.R`), orchestration, tracing (`traces.R`), and utilities.\\n- **Grouped helpers**: Each family (e.g., module, optimizer) has its implementation and helpers in specific files.\\n  - `signature.R`: Parses and validates declarative signatures\\n  - `module.R`: Core module class and logic\\n  - `optimizer-core.R`: Algorithms for prompt/program optimization\\n  - `run.R`: Main logic for module execution\\n  - `traces.R`: Logging and trace management\\n\\n---\\n\\n## Entry Points\\n- `signature` \u2014 Define workflow input/output structure\\n- `module` \u2014 Build LLM workflow module\\n- `run` \u2014 Execute module on new or test data\\n- `evaluate` \u2014 Compare output vs. gold labels\\n- `compile` \u2014 Compile modules or workflows\\n- `optimize_grid` \u2014 Systematic prompt/parameter optimization\\n\\n---\\n\\n## Watch Out For\\n- **Signature/data mismatch:** Signature field names must match your data columns and prompt placeholders.\\n- **Prompt placeholders:** Placeholders (e.g. `{question}`) must exist in both signature/input and prompt text.\\n- **Evaluation/optimization:** Labeled evaluation sets must have all required input/output columns as per the signature.\\n\\n---\"}"
