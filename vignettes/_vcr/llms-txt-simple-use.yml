                  "text": "{\"reasoning\":\"First, we want to show a minimal example of defining a signature and running a simple LLM workflow. This covers basic usage and the declarative style. Next, a more realistic workflow involves composing a module, compiling, optimizing with data, and evaluating, demonstrating the test-driven, compositional, and data-centric nature. Gotchas include: (1) forgetting to define signatures before module creation, (2) not supplying test/evaluation data for optimization (data-driven), and (3) confusing ellmer and dsprrr functionality (dsprrr is for optimization over time).\",\"basic\":\"library(dsprrr)\\n\\n# Define a simple signature: question -> answer\\nsig <- signature(\\\"question -> answer\\\")\\n\\n# Create a module (LLM-driven Q&A)\\nqa_mod <- module(signature = sig)\\n\\n# Run a simple LLM prediction (mock input)\\nresult <- run(qa_mod, question = \\\"What is the capital of France?\\\")\\nprint(result)\\n\",\"intermediate\":\"library(dsprrr)\\nlibrary(tibble)\\n\\n# Define signature\\ndir_sig <- signature(\\\"document -> sentiment\\\")\\n\\n# Create a classification module\\nsentiment_mod <- module(signature = dir_sig, task = \\\"Classify sentiment of the document.\\\")\\n\\n# Training data (labeled examples)\\nlabeled_data <- tibble(\\n  document = c(\\\"I love R!\\\", \\\"This is terrible...\\\", \\\"It's fine, I guess.\\\"),\\n  sentiment = c(\\\"positive\\\", \\\"negative\\\", \\\"neutral\\\")\\n)\\n\\n# Compile the module (optional for optimization)\\ncompiled_mod <- compile(sentiment_mod)\\n\\n# Optimize LLM module using examples\\ngrid_search <- optimize_grid(compiled_mod, trainset = labeled_data)\\n\\n# Evaluate on new data\\ntest_data <- tibble(document = c(\\\"Amazing!\\\", \\\"Awful!\\\"), sentiment = c(\\\"positive\\\", \\\"negative\\\"))\\nresults <- evaluate(grid_search$best_config, dataset = test_data)\\nprint(results)\\n\",\"gotchas\":[\"Defining modules without first declaring signatures leads to errors: always use signature() first.\",\"Attempting optimization or evaluation without labeled (ground truth) data disables key features.\",\"Confusing dsprrr with ellmer: optimization, test-driven workflows, and traceability are only in dsprrr.\"]}"
