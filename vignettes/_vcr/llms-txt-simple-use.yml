        programs that can be systematically improved using your data.\n\n**Use cases:**\n\n-
        RAG pipelines where you want to optimize retrieval + generation\n  together\n-
        Classification or extraction tasks with labeled examples to learn from\n-
        Multi-step agents where you need to trace what went wrong\n- Any LLM workflow
        you want to improve without manually rewriting\n  prompts\n\n**When to just
        use ellmer:** If you have a prompt that works and don’t\nneed to optimize
        it with data. ellmer already tracks conversation\nhistory and token costs.\n\n##
        Installation\n\n``` r\n# install.packages(\"pak\")\npak::pak(\"JamesHWade/dsprrr\")\n```\n\n##
        What dsprrr adds\n\n### Signatures\n\nA compact notation for defining LLM
        inputs and outputs:\n\n``` r\nlibrary(dsprrr)\n#> \n#> Attaching package:
