                  "text": "{\"wrapper\":\"# dsprrr\\n\\ndsprrr enables R users to build, optimize, and systematically improve LLM-powered applications using a declarative, programmatic approach inspired by the DSPy framework.\\n\\n---\\n\\n## Key Concepts\\n\\n- **Declarative Signatures:** Compact, formal specifications of LLM program inputs and outputs that allow for robust composition and analysis of workflows.\\n- **Composable Modules:** Reusable building blocks for constructing multi-step or modular LLM applications, enabling complex agent and pipeline construction.\\n- **Automatic Prompt Optimization:** Systematic improvement of LLM prompt performance using real data, automating the traditionally manual task of prompt tuning.\\n- **Test-Driven LLM Workflows:** Behaviors are specified and validated with test data, improving reliability and repeatability.\\n- **Integration with tidyverse:** Native compatibility with the tidyverse, allowing LLM workflows to fit seamlessly into modern R data pipelines.\\n\\n---\\n\\n## Quick Start\\n\\n```r\\nlibrary(dsprrr)\\n\\n# Define a simple signature for a question-answering task\\nqa_sig <- Signature('question -> answer')\\n\\n# Print the signature\\naq_sig\\n```\\n\\n---\\n\\n## Common Workflow\\n\\n```r\\nlibrary(dsprrr)\\nlibrary(tibble)\\n\\n# Define a signature for sentiment classification\\nsentiment_sig <- Signature('review -> sentiment')\\n\\n# Create a module for the classification task\\nsentiment_module <- module(\\n  signature = sentiment_sig,\\n  prompt = 'Classify the sentiment of the following review as positive or negative:',\\n  model = 'gpt-3.5-turbo'\\n)\\n\\n# Sample test data\\ntest_reviews <- tibble(\\n  review = c('Great product!', 'Terrible experience.'),\\n  sentiment = c('positive', 'negative')\\n)\\n\\n# Evaluate the module on the test set\\neval_results <- evaluate(sentiment_module, data = test_reviews)\\neval_results\\n```\\n\\n---\\n\\n## Code Organization\\n\\nThe codebase is organized into functional domains:\\n- **Assertions**: assertion-helpers.R, assertion.R \u2013 for robust workflow validation.\\n- **Signatures**: signature.R, signature-parser.R, signature-transforms.R \u2013 for declaring and parsing program interfaces.\\n- **Modules**: module.R, plus many module-*.R files \u2013 define LLM workflow components and agents.\\n- **Optimization**: optimize.R, optimizer-core.R, optimizer-accessors.R, optimizer-logging.R, optimizer-discrete-bo.R \u2013 for prompt and module optimization.\\n- **Prompt Architecture**: teleprompter.R and teleprompter-*.R files \u2013 for prompt strategy and adaptation.\\n- **Orchestration**: run.R \u2013 for workflow/process execution.\\n\\nEach concept has dedicated files, modular for extensibility.\\n\\n---\\n\\n## Entry Points\\n\\n- `Signature()` \u2013 Define LLM program input/output format\\n- `module()` \u2013 Create composable LLM workflow modules\\n- `Teleprompter()` \u2013 For advanced/optimized prompt adaptation\\n- `compile()` \u2013 Make a workflow ready for evaluation or execution\\n- `optimize_grid()` \u2013 Systematic prompt and parameter optimization\\n- `evaluate()` \u2013 Test module performance on datasets\\n- `run()` \u2013 Orchestrate and execute LLM workflows\\n- `dsp()` \u2013 High-level programmatic LLM abstraction (DSPy-style)\\n\\n---\\n\\n## Watch Out For\\n\\n- Not loading dsprrr or dependencies (like ellmer) before use will cause errors with key functions.\\n- `Signature()` syntax errors: ensure the string is of the form `'input -> output'`.\\n- When using `evaluate()` or `optimize_grid()`, not supplying a proper data frame with matching input/output columns will result in mismatches or errors.\\n\"}"
