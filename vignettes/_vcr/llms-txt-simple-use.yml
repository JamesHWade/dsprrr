                  "text": "{\n  \"wrapper\": \"# dsprrr\\n\\nEnables principled, testable, and data-optimizable development of LLM workflows in R by treating prompt pipelines as structured, improvable programs.\\n\\n---\\n\\n## Key Concepts\\n\\n- **Declarative Signatures**: Formal specification of LLM workflow input/output contracts.\\n- **Composable Modules**: Reusable components for constructing complex LLM workflows.\\n- **Prompt Optimization**: Data-driven, systematic improvement of prompts and workflow performance.\\n- **Tracing & Test-Driven Evaluation**: Workflow step logging and systematic output validation.\\n- **Tidyverse Integration**: Seamless use in data pipelines leveraging the tidyverse.\\n\\n---\\n\\n## Quick Start\\n\\n### Minimal Example\\n```r\\nlibrary(dsprrr)\\nsig <- signature(\\\"question -> answer\\\")\\nprint(sig)\\n```\\n\\n### Intermediate/Typical Workflow\\n```r\\nlibrary(dsprrr)\\n# 1. Declare the input-output signature\\nsig <- signature(\\\"question -> answer\\\")\\n\\n# 2. Create a module for a QA task\\nqa_mod <- module(signature = sig, template = \\\"Question: {{question}}\\\\nAnswer:\\\")\\n\\n# 3. Compile the module\\nqa_prog <- compile_module(qa_mod)\\n\\n# 4. Run with single example\\nresult <- run(qa_prog, data.frame(question = \\\"What is the capital of France?\\\"))\\nprint(result)\\n\\n# 5. Grid-search optimize with sample labeled data\\ndf <- data.frame(question = c(\\\"What is 2+2?\\\", \\\"Largest mammal?\\\"),\\n                 answer = c(\\\"4\\\", \\\"Blue whale\\\"))\\nopt_results <- optimize_grid(qa_mod, df)\\nprint(opt_results)\\n\\n# 6. Evaluate module performance\\neval_metrics <- evaluate(qa_prog, df)\\nprint(eval_metrics)\\n```\\n\\n---\\n\\n## Common Workflow\\n\\n1. **Define signature**: Use `signature()` to specify input/output types.\\n2. **Design module**: Create an LLM workflow with `module()`, referencing your signature.\\n3. **Compile**: Make modules executable with `compile_module()`.\\n4. **Run**: Inference on new data via `run()`.\\n5. **Optimize**: Tune workflows with `optimize_grid()` using labeled examples.\\n6. **Evaluate**: Assess outputs and iterate using `evaluate()`.\\n\\n---\\n\\n## Code Organization\\n- **signature.R**: Signature classes and helpers.\\n- **module.R**: Core module system and interfaces.\\n- **optimize.R**: Routines for workflow optimization.\\n- **run.R**: Orchestration/execution logic.\\n- **evaluate.R**: Performance metric and evaluation helpers.\\n\\n---\\n\\n## Entry Points\\n- `signature` \u2014 Define input/output types.\\n- `module` \u2014 Composable workflow specification.\\n- `compile_module` \u2014 Prepare modules for use.\\n- `run` \u2014 Execute workflows on data.\\n- `optimize_grid` \u2014 Data-driven prompt/workflow search.\\n- `evaluate` \u2014 Assess and score outputs.\\n\\n---\\n\\n## Watch Out For\\n- The signature string must use exact 'input -> output' syntax; typos lead to confusing errors.\\n- Modules must be compiled (`compile_module`) before `run()`; using `run()` directly on a raw module fails.\\n- Input data.frames for `run()`/`evaluate()` must have columns matching signature names exactly (e.g., `question`).\"\n}"
