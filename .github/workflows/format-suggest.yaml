# Check formatting without elevated pull_request_target permissions.
# Keep the existing workflow/job names so required check contexts stay stable.
on:
  pull_request:

name: format-suggest.yaml

permissions:
  contents: read

jobs:
  format-suggest:
    name: format-suggest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format --check .
