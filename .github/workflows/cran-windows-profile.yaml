name: CRAN Windows timing diagnostic
on:
  push:
    branches: [diagnostics/cran-windows-timing]
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NOT_CRAN: 'false'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          http-user-agent: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, ragnar=?ignore
          needs: check
      - name: Install package
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", "."))
          stopifnot(status == 0)
      - name: Profile CRAN-mode tests
        shell: Rscript {0}
        run: |
          stopifnot(identical(Sys.getenv("NOT_CRAN"), "false"))
          setwd("tests")
          result <- as.data.frame(testthat::test_check(
            "dsprrr", reporter = "silent", stop_on_failure = FALSE
          ))
          print(head(sort(tapply(result$real, result$file, sum), decreasing = TRUE), 40))
          print(head(result[order(-result$real), c("file", "test", "real")], 60), row.names = FALSE)
          print(colSums(result[c("failed", "warning", "passed", "skipped", "error")]))
          stopifnot(!any(result$failed > 0L | result$error))
