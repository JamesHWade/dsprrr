name: jarl

on:
  push:
    branches: [main, master]
  pull_request:

permissions: read-all

jobs:
  jarl-check:
    name: jarl check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Jarl 0.6.0
        uses: etiennebacher/setup-jarl@v0.1.1
        with:
          version: "0.6.0"
          args: "--version"

      - name: Check R source and tests
        run: jarl check R tests/testthat
